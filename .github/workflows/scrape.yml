name: Ev arama taraması

on:
  schedule:
    # 23:00 ve 11:00 UTC = Almanya'da yaklaşık 00:00 ve 12:00 (kış saatinde tam, yaz saatinde 1 saat kayar)
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/scrape.mjs

      - name: Commit updated data
        run: |
          git config user.name "ev-arama-bot"
          git config user.email "actions@github.com"
          git add docs/data/listings.json docs/data/status.json
          git diff --quiet --cached || git commit -m "Otomatik tarama: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
